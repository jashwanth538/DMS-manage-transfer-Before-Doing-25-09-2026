<template>
    <div class="supply-planning-container">
        <!-- Line Items Details Card -->
        <template if:true={hasLineItems}>
            <div class="line-items-card slds-p-bottom_medium fade-in" style="margin-top: 0; height: 100%;">
                <div style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">
                    <div class="card-header slds-p-horizontal_medium slds-p-vertical_small"
                        style="border-bottom: 1px solid #cbd5e1;">
                        <h2 class="section-title"> Sales Allocation Lines ({totalLines})</h2>
                    </div>
                    <!-- Sub-header Search Bar -->
                    <div class="slds-p-horizontal_medium slds-p-vertical_xx-small generic-search-panel-mini"
                        style="border-bottom: 1px solid #e2e8f0; background: #f8fafc;">
                        <c-generic-search-and-filter-panel search-placeholder="Search line items..." search-label="Search Products"
                            onsearchchange={handleSearchChange} onreset={handleSearchReset}>
                        </c-generic-search-and-filter-panel>
                    </div>
                    <div class="slds-scrollable_x" style="flex-grow: 1; overflow-y: auto;">
                        <table class={tableClass}>
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <template if:true={isPlanPlanned}>
                                        <th scope="col" style="width: 30%;">
                                            <div class="slds-truncate table-header" title="Item">Item</div>
                                        </th>
                                        <th scope="col" style="width: 13%; text-align: center;">
                                            <div class="slds-truncate table-header" title="Qty">Qty</div>
                                        </th>
                                         <th scope="col" style="width: 19%; text-align: center;">
                                             <div class="slds-truncate table-header" title="Reserved">Reserved</div>
                                             <div style="font-size: 0.68rem; color: #64748b; font-weight: 500; text-transform: none; margin-top: 2px; letter-spacing: normal;">Received / Planned</div>
                                         </th>
                                         <th scope="col" style="width: 19%; text-align: center;">
                                             <div class="slds-truncate table-header" title="Transfer">Transfer</div>
                                             <div style="font-size: 0.68rem; color: #64748b; font-weight: 500; text-transform: none; margin-top: 2px; letter-spacing: normal;">Received / Planned</div>
                                         </th>
                                         <th scope="col" style="width: 19%; text-align: center;">
                                             <div class="slds-truncate table-header" title="Procurement">Procurement</div>
                                             <div style="font-size: 0.68rem; color: #64748b; font-weight: 500; text-transform: none; margin-top: 2px; letter-spacing: normal;">Received / Planned</div>
                                         </th>
                                    </template>
                                    <template if:false={isPlanPlanned}>
                                        <th scope="col" style="width: 70%;">
                                            <div class="slds-truncate table-header" title="Item">Item</div>
                                        </th>
                                        <th scope="col" style="width: 30%; text-align: center;">
                                            <div class="slds-truncate table-header" title="Qty">Qty</div>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={pagedLineItems} for:item="item">
                                    <tr key={item.Id} class="slds-hint-parent">
                                        <td>
                                            <div class="slds-truncate font-weight-bold">
                                                <a href={item.url} target="_blank" rel="noopener noreferrer" onclick={navigateToLineItem} data-id={item.Id}
                                                    class="link-styled">{item.ItemName}</a>
                                            </div>
                                            <div class="slds-text-color_weak"
                                                style="font-size: 0.75rem; margin-top: 2px; display: flex; align-items: center; gap: 6px;">
                                                <a href={item.url} target="_blank" rel="noopener noreferrer" onclick={navigateToLineItem} data-id={item.Id}
                                                    style="color: inherit; text-decoration: none;">{item.Name}</a>
                                                <span style="font-size: 0.68rem; padding: 1px 6px; border-radius: 4px; background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; font-weight: 600;">
                                                    Status: {item.Status}
                                                </span>
                                            </div>
                                        </td>
                                        <td style="text-align: center;">
                                            <div class="slds-truncate slds-text-color_regular">{item.Quantity}</div>
                                        </td>
                                        <template if:true={isPlanPlanned}>
                                            <td style="text-align: center;">
                                                <div class="qty-ratio-container">
                                                    <span class="qty-received">{item.ReservedQtyReceived}</span>
                                                    <span class="qty-divider">/</span>
                                                    <span class="qty-planned">{item.ReservedQtyPlanned}</span>
                                                </div>
                                            </td>
                                            <td style="text-align: center;">
                                                <div class="qty-ratio-container">
                                                    <span class="qty-received">{item.TransferQtyReceived}</span>
                                                    <span class="qty-divider">/</span>
                                                    <span class="qty-planned">{item.TransferQtyPlanned}</span>
                                                </div>
                                            </td>
                                             <!-- Procurement: Received / Planned -->
                                             <td style="text-align: center;">
                                                 <div class="qty-ratio-container">
                                                     <span class="qty-received">{item.SupplyRequestQtyReceived}</span>
                                                     <span class="qty-divider">/</span>
                                                     <span class="qty-planned">{item.SupplyRequestQtyPlanned}</span>
                                                 </div>
                                             </td>
                                        </template>
                                    </tr>
                                </template>
                                <template if:false={totalLines}>
                                    <tr>
                                        <td colspan={tableColspan} class="slds-text-align_center slds-p-around_medium"
                                            style="color: #64748b;">
                                            No line items match your search.
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Pagination Panel -->
                <div class="slds-p-horizontal_medium slds-p-top_x-small" style="border-top: 1px solid #e2e8f0; background: #ffffff;">
                    <c-generic-pagination current-page={currentPage} page-size={pageSize} total-records={totalLines}
                        hide-go-to-page="true" onpagechange={handlePageChange}>
                    </c-generic-pagination>
                </div>
            </div>
        </template>
        <template if:false={hasLineItems}>
            <template if:false={isLoading}>
                <div class="line-items-card slds-p-around_medium text-center">
                    <p class="slds-text-color_weak">No Line Items found for this Supply Plan.</p>
                </div>
            </template>
        </template>
    </div>
</template>
